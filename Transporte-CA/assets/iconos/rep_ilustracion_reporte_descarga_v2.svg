  <!-- back report sheet -->
  <g transform="rotate(7 190 145)">
    <rect x="99" y="40" width="151" height="204" rx="13" fill="#E7D2B2"/>
    <rect x="89" y="32" width="151" height="204" rx="13" fill="#F4E6D0" stroke="#E8D3B4" stroke-width="1.5"/>
    <path d="M111 61H175M111 80H166M111 99H148" stroke="#D5C2A5" stroke-width="5.5" stroke-linecap="round"/>
  </g>
  <!-- front report sheet -->
  <g transform="rotate(8 162 143)">
    <rect x="77" y="25" width="151" height="207" rx="12" fill="url(#paper)" stroke="#E8D4B7" stroke-width="1.8"/>
    <path d="M99 51H165M99 68H153M99 85H132" stroke="#D9C7AE" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M103 191H209" stroke="#D5C2A7" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="111" y="162" width="14" height="29" rx="1.5" fill="#B8B17A"/>
    <rect x="135" y="140" width="14" height="51" rx="1.5" fill="#32654F"/>
    <rect x="159" y="121" width="14" height="70" rx="1.5" fill="#17503D"/>
    <rect x="183" y="102" width="14" height="89" rx="1.5" fill="#D29B56"/>
  </g>
  <!-- download badge overlapping lower right -->
  <circle cx="246" cy="222" r="36" fill="#F8F0E2"/>
  <circle cx="246" cy="222" r="33.5" fill="url(#green)"/>
  <path d="M246 201V235M234 224.5 246 236.5 258 224.5M233 244H259" stroke="#FFF9EE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

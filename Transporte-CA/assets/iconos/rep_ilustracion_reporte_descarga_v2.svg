<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" fill="none">
  <defs>
    <linearGradient id="halo" x1="65" y1="40" x2="290" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E5C9"/><stop offset="1" stop-color="#EAD2AD"/>
    </linearGradient>
    <linearGradient id="paper" x1="100" y1="35" x2="250" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF5"/><stop offset="1" stop-color="#F4E5CD"/>
    </linearGradient>
    <linearGradient id="green" x1="226" y1="184" x2="283" y2="258" gradientUnits="userSpaceOnUse">

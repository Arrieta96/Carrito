    <path d="M67 244C48 204 51 148 76 105"/>
    <path d="M61 201C38 182 34 159 40 139C58 149 68 169 61 201Z" fill="url(#leaf)"/>
    <path d="M65 177C83 159 89 137 82 117C65 132 58 151 65 177Z" fill="url(#leaf)"/>
    <path d="M58 225C35 213 26 194 29 176C49 184 60 201 58 225Z" fill="url(#leaf)"/>
    <path d="M72 151C88 133 91 111 82 94C67 111 64 131 72 151Z" fill="url(#leaf)"/>
    <path d="M59 201 42 147M66 174 81 119M56 222 34 184" opacity=".65" stroke-width="1.2"/>
    <path d="M293 244C311 205 309 151 286 109"/>
    <path d="M299 202C321 185 326 162 319 142C301 153 292 172 299 202Z" fill="url(#leaf)"/>
    <path d="M294 177C276 160 270 138 278 119C294 135 301 154 294 177Z" fill="url(#leaf)"/>
    <path d="M302 226C324 214 333 195 329 177C309 186 300 204 302 226Z" fill="url(#leaf)"/>
    <path d="M287 151C271 134 267 112 276 96C291 113 295 132 287 151Z" fill="url(#leaf)"/>
    <path d="M300 201 318 150M293 175 278 121M304 223 325 185" opacity=".65" stroke-width="1.2"/>

    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#82945B"/><stop offset="1" stop-color="#294B30"/>
    </linearGradient>
    <filter id="shadow" x="20" y="10" width="320" height="290" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- soft warm halo -->

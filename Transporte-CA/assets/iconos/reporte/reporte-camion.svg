
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .contorno {
      stroke: var(--camion-contorno, #003F35);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .caja {
      fill: var(--camion-caja, #064B3F);
    }
    .ventana {
      fill: var(--camion-ventana, #F8F1E3);
    }
    .franja {
      fill: var(--camion-franja, #F8F1E3);
    }
    .llanta {
      fill: var(--camion-llanta, #003F35);
      stroke: var(--camion-contorno, #003F35);
      stroke-width: 8;
    }
    .aro {
      fill: var(--camion-aro, #F8F1E3);
      stroke: var(--camion-contorno, #003F35);
      stroke-width: 8;
    }
    .centro {
      fill: var(--camion-centro, #F8F1E3);
    }
  </style>

  <!-- Caja de carga -->
  <path class="caja contorno"
        d="M38 130 H312 V305 H38 Z"/>

  <!-- Cabina -->
  <path class="caja contorno"
        d="M312 163 H418
           Q430 163 431 176
           Q432 190 418 193
           L400 194
           L463 277
           Q474 291 474 307
           V325 H312 Z"/>

  <!-- Ventana -->
  <path class="ventana contorno"
        d="M367 194
           H400
           L455 263
           H367
           Q347 263 347 243
           V222
           Q347 194 367 194 Z"/>

  <!-- Divisiones verticales de la caja -->
  <path d="M80 165 V270
           M118 165 V270
           M156 165 V270
           M194 165 V270
           M232 165 V270
           M270 165 V270"
        fill="none"
        stroke="var(--camion-franja, #F8F1E3)"
        stroke-width="16"
        stroke-linecap="round"/>

  <!-- Chasis y franja inferior -->
  <path class="franja contorno"
        d="M38 305
           H105
           Q130 290 153 305
           H365
           Q405 283 440 305
           H474
           V326
           Q474 341 459 341
           H38 Z"/>

  <!-- Rueda trasera -->
  <g>
    <circle class="llanta" cx="107" cy="338" r="43"/>
    <circle class="aro" cx="107" cy="338" r="24"/>
    <circle class="centro" cx="107" cy="338" r="8"/>
  </g>

  <!-- Rueda delantera -->
  <g>
    <circle class="llanta" cx="405" cy="338" r="43"/>
    <circle class="aro" cx="405" cy="338" r="24"/>
    <circle class="centro" cx="405" cy="338" r="8"/>
  </g>
</svg>
